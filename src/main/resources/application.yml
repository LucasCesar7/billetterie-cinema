spring:
  application:
    name: billetterie-backend
  datasource:
    url: jdbc:mysql://localhost:3306/billetterie_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: cinema_user
    password: cinema_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

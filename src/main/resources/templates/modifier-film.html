<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: entete('Modifier le Film')}"></head>
<body>
    <header th:replace="~{layout :: barre-navigation('programmation')}"></header>

    <main class="conteneur" style="max-width: 600px;">
        <div style="margin-bottom: 1.5rem;">
            <a th:href="@{/programmation}" style="display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; color: var(--texte-secondaire);">
                <span>←</span>
                <span>Retour à la gestion de programmation</span>
            </a>
        </div>

        <section class="carte-film" style="padding: 2rem;">
            <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--texte-principal); margin-bottom: 0.5rem;">
                Modifier le Film
            </h1>
            <p style="color: var(--texte-secondaire); font-size: 0.9rem; margin-bottom: 1.5rem;">
                Ajustez les métadonnées du film dans le catalogue.
            </p>

            <form th:action="@{'/programmation/films/' + ${film.id} + '/modifier'}" method="post">
                <div class="form-groupe">
                    <label for="titre" class="form-label">Titre du film</label>
                    <input type="text" id="titre" name="titre" class="form-input" th:value="${film.titre}" required>
                </div>

                <div class="form-groupe">
                    <label for="genre" class="form-label">Genre</label>
                    <input type="text" id="genre" name="genre" class="form-input" th:value="${film.genre}">
                </div>

                <div class="form-groupe">
                    <label for="dureeMinutes" class="form-label">Durée (en minutes)</label>
                    <input type="number" id="dureeMinutes" name="dureeMinutes" class="form-input" min="40" max="300" th:value="${film.dureeMinutes}" required>
                    <div class="form-aide">Comprise entre 40 et 300 minutes.</div>
                </div>

                <div class="form-groupe">
                    <label for="dateSortie" class="form-label">Date de sortie nationale</label>
                    <input type="date" id="dateSortie" name="dateSortie" class="form-input" th:value="${film.dateSortie}">
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-or" style="flex: 1;">
                        Enregistrer les modifications
                    </button>
                    <a th:href="@{/programmation}" class="btn btn-secondaire">
                        Annuler
                    </a>
                </div>
            </form>
        </section>
    </main>

    <footer th:replace="~{layout :: pied-page}"></footer>
</body>
</html>
